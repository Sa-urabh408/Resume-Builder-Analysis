<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ResumeAI</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background-color: var(--bg-primary);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .auth-brand .logo-box {
      width: 26px;
      height: 26px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .auth-brand span {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2.5rem 2.25rem;
      box-shadow: var(--shadow-card);
    }
    .auth-header {
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .auth-header h1 {
      font-size: 1.85rem;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    .auth-header p {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .auth-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }
    .auth-footer a {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <a href="/" class="auth-brand">
      <div class="logo-box">R</div>
      <span>ResumeAI</span>
    </a>

    <div class="auth-container">
      <div class="auth-header">
        <span class="section-tag">Account Recovery</span>
        <h1>Reset password</h1>
        <p>Enter your email address to receive password reset instructions.</p>
      </div>

      <div id="error-alert" class="alert alert-error" style="display:none;"></div>
      <div id="success-alert" class="alert alert-success" style="display:none;"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top: 0.5rem;">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  {% include 'partials/firebase_boot.html' %}
  <script type="module">
    import { auth, firebaseAuthMessage } from "/static/js/main.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const errBox = document.getElementById('error-alert');
    const succBox = document.getElementById('success-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      succBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      if (!email) {
        errBox.textContent = 'Please enter your email address.';
        errBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        await sendPasswordResetEmail(auth, email);
        succBox.textContent = 'Password reset instructions have been sent to ' + email + '. Check your inbox.';
        succBox.style.display = 'block';
        form.style.display = 'none';
      } catch (err) {
        console.error('[ForgotPassword] sendPasswordResetEmail error:', err);
        errBox.textContent = firebaseAuthMessage(err);
        errBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
