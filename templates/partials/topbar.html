<div class="top-bar">
  <button id="sidebar-toggle" class="sidebar-toggle" type="button">&#9776;</button>
  <div style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em;">
    {{ topbar_label|default('Workspace') }}
  </div>
  <div class="top-bar-right">
    <button class="theme-toggle-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <span id="user-name-top" style="font-size:0.85rem;font-weight:600;color:var(--text-secondary);"></span>
    <div id="user-avatar" style="width:28px;height:28px;border-radius:var(--radius-xs);background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;color:var(--accent-btn-text);">U</div>
  </div>
</div>
